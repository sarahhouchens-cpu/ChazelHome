<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }

/* Layout: a calm app shell. Header + section tabs, one working column, sheets slide up for editing. */
:root {
  --bg: #EEF2F0;
  --surface: #FFFFFF;
  --sunk: #E3E9E6;
  --ink: #16201C;
  --muted: #5B6863;
  --line: #D3DCD8;
  --accent: #1E6E57;
  --accent-ink: #FFFFFF;
  --accent-soft: #D7EAE2;
  --warn: #B4442F;
  --warn-soft: #F6DED8;
  --groceries: #2F7D4F;
  --household: #3A64A8;
  --fun: #A2508C;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --text: "Inter", -apple-system, "Segoe UI", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1513; --surface: #182120; --sunk: #121A18; --ink: #E7EEEB; --muted: #95A39D; --line: #2A3532;
    --accent: #6CC7A6; --accent-ink: #0B1612; --accent-soft: #1D3A31; --warn: #EE8B76; --warn-soft: #3E211B;
    --groceries: #6FC48F; --household: #8BAEEB; --fun: #DA94C7; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1513; --surface: #182120; --sunk: #121A18; --ink: #E7EEEB; --muted: #95A39D; --line: #2A3532;
  --accent: #6CC7A6; --accent-ink: #0B1612; --accent-soft: #1D3A31; --warn: #EE8B76; --warn-soft: #3E211B;
  --groceries: #6FC48F; --household: #8BAEEB; --fun: #DA94C7; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--text); font-size: 15px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.toprow { display: flex; align-items: center; gap: 12px; padding-block: 12px 8px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
.brand .mark { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; }
.brand .iq { color: var(--accent); }
.homename { color: var(--muted); font-size: 13px; }
.spacer { flex: 1; }
.faces { display: flex; }
.faces img { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--bg); margin-left: -6px; background: var(--sunk); }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding-bottom: 8px; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs a { text-decoration: none; color: var(--muted); padding: 7px 12px; border-radius: 999px; font-weight: 600; font-size: 14px; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
nav.tabs a[aria-current="page"] { background: var(--ink); color: var(--bg); }
nav.tabs a .count { font-size: 11px; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 0 6px; }
nav.tabs a[aria-current="page"] .count { background: var(--accent); color: var(--accent-ink); }

main { padding-block: 18px 80px; display: flex; flex-direction: column; gap: 14px; }
h1 { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1.1; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 600; font-size: 18px; margin: 0; letter-spacing: -0.01em; }
.label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row > .grow { flex: 1; min-width: 0; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.list > .item { padding: 11px 14px; border-top: 1px solid var(--line); }
.list > .item:first-child { border-top: 0; }
button.rowbtn { width: 100%; background: none; border: 0; border-top: 1px solid var(--line); text-align: left; }
.list > button.rowbtn:first-child { border-top: 0; }
.initials { width: 24px; height: 24px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 700; }
.initials.lg { width: 36px; height: 36px; font-size: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.num { font-variant-numeric: tabular-nums; }

.btn { border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 600; background: var(--accent); color: var(--accent-ink); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.secondary { background: var(--accent-soft); color: var(--accent); }
.btn.ghost { background: transparent; color: var(--accent); padding: 8px 10px; }
.btn.danger { background: transparent; color: var(--warn); border: 1px solid var(--warn); }
.btn.sm { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
.btn[disabled] { opacity: .5; cursor: default; }
.iconbtn { border: 0; background: transparent; color: var(--muted); width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; flex: none; }
.iconbtn:hover { background: var(--sunk); color: var(--ink); }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--chip, var(--accent)); border-color: var(--chip, var(--accent)); color: #fff; }
:root[data-theme="dark"] .chip[aria-pressed="true"] { color: #0B1612; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip[aria-pressed="true"] { color: #0B1612; } }

input[type=text], input[type=date], input[type=time], input[type=search], select, textarea {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0;
}
textarea { min-height: 90px; resize: vertical; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 600; color: var(--muted); }
.fields2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.check { appearance: none; width: 24px; height: 24px; flex: none; border-radius: 50%; border: 2px solid var(--c, var(--line)); background: transparent; display: grid; place-items: center; margin: 0; }
.check:checked { background: var(--c, var(--accent)); border-color: var(--c, var(--accent)); }
.check:checked::after { content: ""; width: 10px; height: 6px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: translateY(-1px) rotate(-45deg); }
.done-text { text-decoration: line-through; color: var(--muted); }
.avatar { width: 24px; height: 24px; border-radius: 50%; flex: none; background: var(--sunk); }
.avatar.lg { width: 36px; height: 36px; }
.pill { font-size: 12px; border-radius: 999px; padding: 1px 8px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; align-items: center; }
.empty strong { color: var(--ink); font-size: 16px; }
.notice { border-radius: var(--r); padding: 12px 14px; background: var(--accent-soft); color: var(--ink); font-size: 14px; }
.notice.warn { background: var(--warn-soft); }

/* calendar */
.month { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.month .dow { text-align: center; font-size: 11px; font-weight: 600; color: var(--muted); padding-bottom: 4px; }
.month button { border: 0; background: transparent; border-radius: 10px; aspect-ratio: 1 / 1; max-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-variant-numeric: tabular-nums; }
.month button.out { color: var(--muted); opacity: .55; }
.month button.today { box-shadow: inset 0 0 0 1.5px var(--accent); font-weight: 700; }
.month button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.dots { display: flex; gap: 2px; height: 5px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.month button[aria-pressed="true"] .dots i { background: var(--bg); }
.time { width: 74px; flex: none; color: var(--muted); font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; }
.stripe { width: 4px; align-self: stretch; border-radius: 2px; flex: none; }

/* lists */
.cat { --chip: var(--groceries); }
.cat.household { --chip: var(--household); }
.cat.fun { --chip: var(--fun); }
.addbar { display: grid; grid-template-columns: 1fr 90px auto; gap: 8px; }
.qty { color: var(--muted); font-size: 13px; }
.tray { display: flex; gap: 6px; flex-wrap: wrap; padding-top: 8px; }

/* menu */
.day.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.meal { width: 76px; flex: none; color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.ingrow { display: grid; grid-template-columns: 100px 1fr 32px; gap: 8px; align-items: center; }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(8, 14, 12, .45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 620px; max-height: 92%; overflow: auto; border-radius: 18px 18px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; animation: up .18s ease-out; }
@media (min-width: 700px) { .scrim { align-items: center; } .sheet { border-radius: 18px; } }
@keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--warn-soft); padding: 10px 12px; border-radius: 10px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 60; max-width: calc(100% - 32px); font-size: 14px; }
.skeleton { height: 64px; border-radius: var(--r); background: var(--sunk); }
@media (max-width: 420px) { .fields2 { grid-template-columns: 1fr; } .addbar { grid-template-columns: 1fr 70px auto; } h1 { font-size: 26px; } }

.auth { max-width: 460px; }
.code { font-family: var(--display); font-size: 34px; font-weight: 800; letter-spacing: 0.25em; color: var(--accent); user-select: all; }
.face { margin-left: -6px; border: 2px solid var(--bg); border-radius: 50%; display: inline-flex; }
.swatch { width: 32px; height: 32px; border-radius: 50%; border: 3px solid transparent; }
.swatch[aria-pressed="true"] { border-color: var(--ink); }
input[type=email], input[type=password] { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
code { font-size: 13px; }
</style>
